<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="robots" content="__ROBOTS__">
__HEADINIT__
<style>
__BASECSS__
.pg { background: radial-gradient(70% 60% at 50% 0%, var(--atmo-haze), transparent 70%), radial-gradient(circle, var(--dot) 1.1px, transparent 1.3px) 0 0 / 22px 22px, var(--ground); min-height: calc(100vh - 64px) }
.pg .wrap { padding-block: 56px 56px; display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 760px }
.pg h1 { margin: 0; font: 400 clamp(40px, 7vw, 64px)/1 var(--font-serif); text-wrap: balance }
.pg h1 i { font-style: italic }
.pg p.lead { margin: 0; color: var(--ink-muted); font: 400 17px/24px var(--font-sans); max-width: 560px }
.ok { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--sketch-soft); color: var(--sketch); font-size: 30px }
.next { width: 100%; display: grid; gap: 10px; text-align: left; counter-reset: n }
.next div { counter-increment: n; display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 14px 16px; border: 1px solid var(--hairline); border-radius: var(--r-md); background: var(--surface); font: 400 14px/20px var(--font-sans); color: var(--ink-muted) }
.next div::before { content: counter(n); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-sunk); color: var(--ink); font: 500 12px/1 var(--font-mono) }
.next b { display: block; color: var(--ink); font-weight: 500 }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center }
.kpis { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.kpi { border: 1px solid var(--hairline); border-radius: var(--r-md); background: var(--surface); padding: 16px; text-align: left; display: grid; gap: 6px }
.kpi span { font: 500 12px/1 var(--font-sans); color: var(--ink-muted) }
.kpi b { font: 400 40px/1 var(--font-serif) }
.kpi small { font: 400 12px/16px var(--font-sans); color: var(--ink-muted) }
.who { display: flex; align-items: center; gap: 12px; justify-content: center }
.who img { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--hairline); background: #fff }
.who b { font: 500 18px/1.2 var(--font-sans) }
.who small { display: block; font: 400 13px/1 var(--font-mono); color: var(--ink-muted); margin-top: 4px }
.list { width: 100%; display: grid; gap: 8px }
.list a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border: 1px solid var(--hairline); border-radius: var(--r-md); background: var(--surface); text-decoration: none; font: 500 14px/1.3 var(--font-sans) }
.list a small { font: 400 12px/1.3 var(--font-mono); color: var(--ink-muted) }
.doc { width: 100%; text-align: left; display: grid; gap: 6px; font: 400 15px/24px var(--font-sans); color: var(--ink-muted) }
.doc h2 { margin: 18px 0 0; font: 400 26px/1.2 var(--font-serif); color: var(--ink) }
.doc a { color: var(--ink) }
.fine { font: 400 12px/18px var(--font-sans); color: var(--ink-muted) }
</style>
</head><body>
<header class="nav gut"><div class="wrap">
  <a class="mark" href="../../" aria-label="System design kit, home"><span class="long">System design <i>kit</i></span><span class="short">SD <i>kit</i></span></a>
  <span class="sp"></span>
  __THEMEBTN__
  <a class="pill primary" href="../">Sponsor</a>
</div></header>
<main class="pg gut"><div class="wrap" id="app">__BODY__</div></main>
<footer class="gut"><div class="wrap"><span>MIT · by Dinesh Sunny</span><span class="help">Need help? <a data-mail="Sponsorship" href="#contact">Email</a> · <a href="https://github.com/Dinesh-Sunny/excalidraw-system-design-kit/discussions" target="_blank" rel="noopener">Ask a question</a> · <a href="https://github.com/Dinesh-Sunny/excalidraw-system-design-kit/issues/new/choose" target="_blank" rel="noopener">Report a bug</a></span><span><a href="../../">Back to the kit</a></span></div></footer>
<script>
const SP = __SPONSOR__;
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
$("#theme").onclick = () => { const d = document.documentElement, t = d.dataset.theme === "dark" ? "light" : "dark"; d.dataset.theme = t; try { localStorage.setItem("sdk-theme", t); } catch (e) {} };
__SCRIPT__
/* contact links: address assembled at runtime to keep scrapers off it */
(() => { const c = SP.contact || {}; if (!c.user) return; document.querySelectorAll("a[data-mail]").forEach(a => { a.href = `mailto:${c.user}@${c.domain}?subject=${encodeURIComponent("System Design Kit - " + a.dataset.mail)}`; }); })();

</script>
</body></html>
