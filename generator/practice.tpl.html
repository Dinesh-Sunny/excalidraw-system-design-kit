__BASECSS__
[hidden] { display: none !important }
/* ---------- picker ---------- */

/* ---------- workspace: one screen, fixed top and bottom bars, nothing to hunt for ---------- */
body.run { overflow: hidden }

.ws { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; background: var(--ground) }

.ans li code { font: 400 14px/22px var(--font-mono); word-break: break-word }
/* design step: the canvas is the screen */
.stagecv { height: 100%; display: grid; grid-template-rows: 1fr auto; min-height: 0 }
.canvas { position: relative; min-height: 0; background: radial-gradient(circle, #d3d6de 1.1px, transparent 1.3px) 0 0 / 22px 22px, #fff; display: grid; place-items: center; padding: 24px; overflow: hidden }
.canvas svg { width: 100%; height: 100%; animation: fadein .3s ease-out }
@keyframes fadein { from { opacity: .5 } }
.cap { display: flex; align-items: baseline; gap: 12px; padding: 14px max(20px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--hairline); background: var(--surface); min-height: 64px }

/* bottom bar: Back left, one primary action right, always in the same place */
.bot { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--hairline); background: var(--surface) }

.link { border: 0; background: none; padding: 0 6px; cursor: pointer; font: 500 13px/1 var(--font-sans); color: var(--ink-muted); text-decoration: underline; text-underline-offset: 3px }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--pill); color: var(--on-ink); padding: 10px 18px; border-radius: 9999px; font: 500 14px/1 var(--font-sans); transition: .2s ease-out; pointer-events: none; z-index: 50 }

@media (max-width: 700px) { .canvas { place-items: center start; overflow: auto; padding: 10px } .canvas svg { width: auto; height: 100%; min-width: 0; flex: none } }

#bMain { gap: 0 } #bMain .kbd { margin-left: 8px }
.ans .cmp li { padding: 10px 0 } .ans .cmp li::before { content: none }
.cmp { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--hairline) }

.cmp li.ok .mk, .mk.ok { color: #2f9e44 } .cmp li.miss .mk, .mk.miss { color: var(--sketch) }
.cmp li.ok { color: var(--ink-muted) }
.legend { margin: 6px 0 0; font: 400 12px/18px var(--font-sans); color: var(--ink-muted) } .legend .mk { display: inline-block; width: 18px }
.ans { display: grid; gap: 8px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--hairline); animation: rise .35s cubic-bezier(.2,.8,.2,1) }
.ans h4 { margin: 8px 0 0; font: 500 12px/16px var(--font-mono); color: var(--ink-muted); text-transform: uppercase; letter-spacing: .05em }
.rate { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font: 400 13px/1 var(--font-sans); color: var(--ink-muted) }

.rate button.on.nail { background: #2f9e44; color: #fff; border-color: #2f9e44 } .rate button.on.part { background: #e67700; color: #fff; border-color: #e67700 } .rate button.on.miss { background: #e03131; color: #fff; border-color: #e03131 }
.tabs .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 6px; vertical-align: 2px } .dot.nail { background: #2f9e44 } .dot.part { background: #e67700 } .dot.miss { background: #e03131 }
.calc { padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--hairline); background: var(--surface); grid-template-columns: minmax(0, 1fr) }

.cin { display: grid; gap: 8px }

.cf input { height: 36px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--ground); padding: 0 10px; font: 500 14px/1 var(--font-mono); color: var(--ink); width: 100% }

.xbtn { width: 32px; height: 40px; border: 0; background: none; cursor: pointer; color: var(--ink-muted); font: 400 18px/1 var(--font-sans); border-radius: 8px } .xbtn:hover { background: var(--surface-sunk) }
.addrow { justify-self: start; border: 1px dashed var(--hairline); background: none; border-radius: 9999px; height: 36px; padding: 0 14px; cursor: pointer; font: 500 13px/1 var(--font-sans); color: var(--ink-muted) } .addrow:hover { border-color: var(--slate); color: var(--ink) }
@media (max-width: 560px) { .api { grid-template-columns: 84px minmax(0, 1fr) 32px } .api [data-api="r"] { grid-column: 1 / 3 } .ent .er { grid-template-columns: 1fr 1fr 32px } .cf { grid-template-columns: 1fr 80px 44px } }
.pickq { display: grid; gap: 10px; width: 100% } .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px }
.opt { height: 44px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--hairline); background: var(--ground); cursor: pointer; font: 500 14px/1.2 var(--font-sans); color: var(--ink); text-align: left; transition: border-color .15s, background .15s }
.opt:hover { border-color: var(--sketch); background: var(--sketch-soft) }
.fb { animation: rise .25s ease-out } .fb b { font: 600 15px/22px var(--font-sans) } .fb.ok b { color: #2f9e44 } .fb.no b { color: #e67700 } .fb span { color: var(--ink-muted); font: 400 15px/22px var(--font-sans) }
.cap { flex-wrap: wrap } .cap .rate { width: 100%; margin-top: 4px }

.scard { display: grid; gap: 4px } .srow { display: grid; grid-template-columns: 130px 1fr 80px; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left; font: 500 14px/1 var(--font-sans); color: var(--ink) } .srow:hover { background: var(--surface-sunk) }
.srow em { font: 400 12px/1 var(--font-mono); color: var(--ink-muted); font-style: normal; text-align: right }
.sb { height: 8px; border-radius: 9999px; background: var(--hairline); position: relative; overflow: hidden } .sb::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w, 0); border-radius: inherit; background: #e03131 } .sb[data-v="part"]::after { background: #e67700 } .sb[data-v="nail"]::after { background: #2f9e44 }
.col .row { display: flex; flex-wrap: wrap; gap: 10px }

/* design step v2 */
.dz { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; min-height: 0 }

.dz .canvas { padding: 0; place-items: stretch; overflow: hidden }
.dz .canvas svg { width: 100%; height: 100%; display: block; animation: none }

.hits .fresh { stroke: #6965db; stroke-width: 4; animation: fresh 1.6s ease-out forwards }

.move { display: grid; gap: 14px; align-content: start; padding: 20px; background: var(--surface); border-top: 1px solid var(--hairline); overflow: auto; max-height: 46vh }
@media (min-width: 1000px) { .move { max-height: none } }
.mh { display: grid; gap: 8px }
.dots { display: flex; gap: 4px } .dots i { flex: 1; height: 6px; border-radius: 9999px; background: var(--hairline) } .dots i.ok { background: #2f9e44 } .dots i.hp { background: #e67700 } .dots i.now { background: var(--sketch) }

.fb2 b { font: 600 15px/22px var(--font-sans); color: var(--ink) } .fb2 .stl { font: 500 13px/19px var(--font-mono, monospace); color: var(--ink-muted) } .fb2.ok { background: #ebfbee } .fb2.ok b { color: #2b8a3e } .fb2.no { background: #fff4e6 } .fb2.no b { color: #d9480f }

/* boards for every step */

.note { padding: 14px 16px; border-radius: 6px; font: 400 19px/1.3 var(--font-hand); color: #1e1e1e; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 14px rgba(0,0,0,.06); transform: rotate(-.6deg) }

.note.f { background: #fff3bf } .note.n { background: #d0ebff } .note.w { background: #ffe3e3 }
.fresh { animation: land .55s cubic-bezier(.2,1.3,.4,1) both; outline: 3px solid var(--sketch-soft) }
@keyframes land { from { opacity: 0; transform: translateY(-18px) scale(.94) } }

.ests { display: grid; gap: 10px } .estc { padding: 12px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--hairline); font: 400 19px/1.3 var(--font-hand) }

function stepScore() { // your own rating if you gave one, else how many you got right first time
  const r = rec().rate || {}, v = { nail: 2, part: 1, miss: 0 }, qp = rec().qp || {}, pk = rec().picks || {};
  const ratio = o => { const vals = Object.values(o || {}); return vals.length ? vals.filter(x => x === true).length / vals.length * 2 : null; };
  return STEPS.map(x => x.k).map(k => { const rk = k === "deep" ? r.deep0 : r[k]; if (rk) return v[rk]; return k === "hld" ? ratio(pk) : ratio(qp[k]); });
}
function renderScore() {
  const sc = stepScore(), got = sc.filter(x => x !== null), pct = got.length ? Math.round(got.reduce((a, b) => a + b, 0) / (got.length * 2) * 100) : 0;
  const weak = sc.map((x, i) => [x, i]).filter(([x]) => x !== null && x < 1.5).map(([, i]) => i);
  const nxt = D.filter(d => d.slug !== Q.slug && d.track === Q.track && !(store.get()[d.slug] || {}).done)[0] || D[(D.indexOf(BY[Q.slug]) + 1) % D.length];
  const bar = x => x === null ? `<i class="sb"></i>` : `<i class="sb" style="--w:${x / 2 * 100}%" data-v="${x >= 1.5 ? "nail" : x >= 0.5 ? "part" : "miss"}"></i>`;
  const none = !got.length;
  $("#stage").innerHTML = `<div class="col"><span class="dvn">Scorecard</span><h3 class="qn">${none ? "Your score shows here" : pct + "%"} <small>${none ? "" : "first try and your ratings"}</small></h3>
    <div class="scard">${STEPS.map((x, i) => `<button type="button" class="srow" data-step="${i}"><span>${x.t}</span>${bar(sc[i])}<em>${sc[i] === null ? "not rated" : sc[i] >= 1.5 ? "Strong" : sc[i] >= 0.5 ? "Partly" : "Review"}</em></button>`).join("")}</div>
    <p class="look">${none ? "Answer a few steps and each one gets its bar. Start with Requirements." : weak.length ? `Practise ${weak.map(i => STEPS[i].t.toLowerCase()).join(", ")} again, then redraw the whole design from memory tomorrow.` : "Strong across the board. Redraw it from memory tomorrow to lock it in."}</p>
    <div class="row">${none ? `<button class="pill primary" type="button" data-step="0">Start with Requirements</button>` : ""}${weak.length ? `<button class="pill primary" type="button" data-step="${weak[0]}">Practise ${STEPS[weak[0]].t.toLowerCase()}</button>` : ""}<button class="pill ghost" type="button" data-x="copy">Copy design to Excalidraw</button><button class="pill ghost" type="button" data-x="save">${onBoard(Q.kit) ? "Saved to your board" : "Save to your board"}</button><a class="pill ghost" href="../#i=${Q.kit}">Open in the blocks</a></div>
    <div class="fbrow"><span>Helpful?</span><button class="chip" type="button" data-fb="love"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16.5s-6.5-3.9-6.5-8.6A3.4 3.4 0 0 1 10 5.6a3.4 3.4 0 0 1 6.5 2.3c0 4.7-6.5 8.6-6.5 8.6z"/></svg>Yes</button><button class="chip" type="button" data-fb="suggest">Suggest a change</button><span class="sp" style="flex:1"></span><button class="link" type="button" data-x="restart">Start again</button></div></div>`;
  if (!none) put({ done: true, score: pct });
  buttons(`Next: ${esc(nxt.title)}`); $("#bMain").dataset.next = nxt.slug;
}

/* ---- inputs ---- */
function hookNotes(key) { const nt = $("#nt"); if (!nt) return; nt.addEventListener("input", () => sub("notes", { [key]: nt.value })); }
function hookTools() {
  document.querySelectorAll("[data-calc]").forEach(i => i.addEventListener("input", () => { const c = { ...(rec().calc || { dau: 10, act: 10, rw: 10, size: 1, years: 5 }), [i.dataset.calc]: Math.max(0, +i.value || 0) }; put({ calc: c }); $("#cout").innerHTML = calcOut(c); }));
  document.querySelectorAll(".api input, .api select").forEach(el => el.addEventListener("input", () => { const rows = [...document.querySelectorAll(".api")].map(r => ({ m: r.querySelector('[data-api="m"]').value, p: r.querySelector('[data-api="p"]').value, r: r.querySelector('[data-api="r"]').value })); sub("mine", { api: rows }); }));
  document.querySelectorAll(".ent input, .ent select").forEach(el => el.addEventListener("input", () => { const rows = [...document.querySelectorAll(".ent")].map(r => ({ n: r.querySelector('[data-ent="n"]').value, f: r.querySelector('[data-ent="f"]').value, s: r.querySelector('[data-ent="s"]').value, k: r.querySelector('[data-ent="k"]').value })); sub("mine", { data: rows }); }));
  document.querySelectorAll("[data-add]").forEach(inp => inp.addEventListener("keydown", e => {
    if (e.key !== "Enter" || !inp.value.trim()) return; e.preventDefault(); e.stopPropagation();
    const [key, g] = inp.dataset.add.split(":"), m = (rec().mine || {})[key] || {}; m[g] = [...(m[g] || []), inp.value.trim()]; sub("mine", { [key]: m });
    const keep = inp.dataset.add; render(); const again = document.querySelector(`[data-add="${keep}"]`); if (again) again.focus();
  }));
}
function primary() {
  if (setupMode) return startFromSetup();
  const S = STEPS[step], C = Q.c;
  if ($("#bMain").dataset.next) { location.hash = "q=" + $("#bMain").dataset.next; return; }
  if (finished) return;
  if (S.k === "hld") { if (blk < Q.nodes.length) revealNext(); else setStep(step + 1); return; }
  if (!quizDone()) { quizReveal(); return; }
  if (step < LAST()) setStep(step + 1); else { finished = true; history.replaceState(null, "", "#q=" + Q.slug + "&s=done"); ev("practice-done/" + Q.slug); render(); }
}
function back() {
  if (setupMode) { history.pushState(null, "", location.pathname); route(); return; }
  const S = STEPS[step];
  if (finished) { finished = false; open_ = true; render(); return; }
  if (S.k === "hld" && blk > 1) { blk--; tries = new Set(); last = null; put({ blk }); renderDesign(); return; }
  if (S.k !== "hld" && quizBack()) return;
  if (step > 0 && STEPS[step - 1].k === "hld") { setStep(step - 1); blk = Q.nodes.length; render(); return; }
  setStep(step - 1);
}
$("#rSetup").onclick = () => { location.hash = "q=" + Q.slug + "&s=setup"; };
$("#bMain").onclick = primary; $("#bPrev").onclick = back;
$("#vRun").addEventListener("click", e => {
  const sb = e.target.closest("[data-sc],[data-lens],[data-mode]"); if (sb && setupMode) { const su = $("#stage")._su; if (sb.dataset.sc) su.sc = sb.dataset.sc; if (sb.dataset.lens !== undefined) su.lens = sb.dataset.lens; if (sb.dataset.mode) su.mode = sb.dataset.mode; SETUP.set(Q.slug, su); renderSetup(); return; }
  const qp = e.target.closest("[data-qp]"); if (qp) { quizPick(+qp.dataset.qp); return; }
  const pk = e.target.closest("[data-pick]"); if (pk) { pickBlock(pk.dataset.pick); return; }
  const zz = e.target.closest("[data-z]"); if (zz && $("#cv svg") && cam) { const svg = $("#cv svg"); if (zz.dataset.z === "fit") { glide(svg, camFor(blk)); return; } const f = zz.dataset.z === "in" ? 0.75 : 1.33, [x, y, w, h] = cam; glide(svg, [x + w * (1 - f) / 2, y + h * (1 - f) / 2, w * f, h * f]); return; }
  const hn = e.target.closest("[data-node]"); if (hn) { const x = Q.nodes.find(y => y.id === hn.dataset.node); last = { ok: true, title: x.title, text: Q.c.blocks[x.id] || "", k: x.k }; renderMove(); return; }
  const sk = e.target.closest("[data-savek]"); if (sk) { boardToggle(sk.dataset.savek, "Block saved"); renderMove(); return; }
  const ck = e.target.closest("[data-copyk]"); if (ck) { copyKit("sdk-" + ck.dataset.copyk, "the block"); return; }
  const fbk = e.target.closest("[data-fb]"); if (fbk) { if (fbk.dataset.fb === "love") { fbk.classList.add("on"); say("Thank you! Glad it helps"); ev("fb-love/practice-" + Q.slug); } else suggest(); return; }
  const rt = e.target.closest("[data-rate]"); if (rt) { const [k, v] = rt.dataset.rate.split(":"); sub("rate", { [k]: v }); rt.parentNode.querySelectorAll("button").forEach(b => b.className = b === rt ? "on " + v : ""); tabs(); return; }
  const del = e.target.closest("[data-del]"); if (del) { const [key, g, i] = del.dataset.del.split(":"), m = (rec().mine || {})[key] || {}; (m[g] || []).splice(+i, 1); sub("mine", { [key]: m }); render(); return; }
  const ad = e.target.closest("[data-apidel]"); if (ad) { const rows = (rec().mine || {}).api || []; rows.splice(+ad.dataset.apidel, 1); sub("mine", { api: rows }); render(); return; }
  const ed = e.target.closest("[data-entdel]"); if (ed) { const rows = (rec().mine || {}).data || []; rows.splice(+ed.dataset.entdel, 1); sub("mine", { data: rows }); render(); return; }
  const x = e.target.closest("[data-x]"); if (x && x.tagName !== "INPUT") { const a = x.dataset.x;
    if (a === "hint") { const k = STEPS[step].k; sub("hints", { [k]: ((rec().hints || {})[k] || 0) + 1 }); render(); ev("practice-hint/" + k); }
    if (a === "apiadd") { sub("mine", { api: [...((rec().mine || {}).api || [{ m: "POST", p: "", r: "" }]), { m: "GET", p: "", r: "" }] }); render(); }
    if (a === "entadd") { sub("mine", { data: [...((rec().mine || {}).data || [{ n: "", f: "", s: "SQL", k: "" }]), { n: "", f: "", s: "SQL", k: "" }] }); render(); }
    if (a === "copy") copyDesign();
    if (a === "save") { const on = boardToggle(Q.kit, "Design saved"); $("#mSave").textContent = on ? "Remove design from my board" : "Save design to my board"; if (finished) render(); }
    if (a === "share") shareQ();
    if (a === "png") copyPng();
    if (a === "dl") downloadDesign();
    if (a === "suggest") suggest();
    if (x.closest("#rMenu")) $("#rMenu").open = false;
    if (a === "restart") { const p = store.get(); delete p[Q.rid]; store.set(p); blk = 1; resetClock(); setStep(0); }
    return; }
  const t = e.target.closest("[data-step]"); if (t) { if (finished) finished = false; setStep(+t.dataset.step); }
});
function shareQ() { const url = location.origin + location.pathname + "#q=" + Q.slug, t = Q.title + " - practise it step by step"; ev("share/practice-" + Q.slug); if (navigator.share && matchMedia("(hover: none)").matches) { navigator.share({ title: t, url }).catch(() => {}); return; } navigator.clipboard.writeText(url).then(() => say("Link copied"), () => say(url)); }
function suggest() { const u = new URL(REPO + "/issues/new"); u.searchParams.set("template", "1-block-feedback.yml"); u.searchParams.set("title", `[Practice] ${Q.title}`); u.searchParams.set("block", "sd:tpl/ " + Q.title); u.searchParams.set("link", location.href); ev("fb/suggest/practice-" + Q.slug); window.open(u.toString(), "_blank", "noopener"); }
async function copyPng() { try { const blob = fetch(`../s/${Q.kitId}.svg`).then(r => r.text()).then(t => new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(new Blob([t], { type: "image/svg+xml" })); img.onload = () => { const c = document.createElement("canvas"); c.width = img.naturalWidth * 2; c.height = img.naturalHeight * 2; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(), "image/png"); }; img.onerror = rej; img.src = url; })); await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); say("Image copied. Paste it anywhere"); ev("copy-png/" + Q.kit); } catch (e) { say("Copy didn't go through. Try the download"); } }
async function downloadDesign() { try { const els = await fetch(`../e/${Q.kitId}.json`).then(r => r.json()); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ type: "excalidraw", version: 2, source: location.origin + location.pathname, elements: els, appState: { viewBackgroundColor: "#ffffff", gridSize: 20 }, files: {} })], { type: "application/json" })); a.download = Q.slug + ".excalidraw"; document.body.append(a); a.click(); a.remove(); say("Downloaded " + Q.slug + ".excalidraw"); ev("download-excalidraw/" + Q.kit); } catch (e) { say("Download didn't go through. Try again"); } }
document.addEventListener("click", e => { document.querySelectorAll("details.menu[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; }); });
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details.menu") && e.target.open) document.querySelectorAll("details.menu[open]").forEach(d => { if (d !== e.target) d.open = false; }); }, true);
async function copyDesign() {
  try {
    const p = fetch(`../e/${Q.kitId}.json`).then(r => r.json()).then(els => new Blob([JSON.stringify({ type: "excalidraw/clipboard", elements: els, files: {} })], { type: "text/plain" }));
    if (window.ClipboardItem && navigator.clipboard.write) await navigator.clipboard.write([new ClipboardItem({ "text/plain": p })]);
    else await navigator.clipboard.writeText(await (await p).text());
    say(`Copied. Paste in Excalidraw with ${MAC ? "⌘" : "Ctrl"} V`); ev("practice-copy/" + Q.slug);
  } catch (e) { say("Copy didn't go through. Try Open in the kit"); }
}
document.addEventListener("keydown", e => {
  if (!Q || e.altKey) return;
  const typing = e.target.closest("textarea, input, select");
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); primary(); return; }
  if (typing || e.metaKey || e.ctrlKey) return;
  if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); primary(); } else if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
  else if (/^[1-4]$/.test(e.key)) { const o = document.querySelectorAll(".opt2")[+e.key - 1]; if (o && !o.disabled) o.click(); }
});
/* 45-minute timer */
let left = 45 * 60, tick = null;
function fmt(s) { const a = Math.abs(s); return (s < 0 ? "-" : "") + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0"); }
function paint() { $("#rClock").textContent = fmt(left); $("#rTimer").classList.toggle("over", left < 0); $("#rTimer").classList.toggle("on", !!tick); }
function stopClock() { clearInterval(tick); tick = null; paint(); }
function resetClock() { clearInterval(tick); tick = null; left = 45 * 60; paint(); }
$("#rTimer").onclick = () => { if (tick) { stopClock(); say("Timer paused"); } else { tick = setInterval(() => { left--; paint(); }, 1000); paint(); say("45-minute timer started"); ev("practice-timer"); } };
route();
(() => { const c = SP.contact || {}; if (!c.user) return; document.querySelectorAll("a[data-mail]").forEach(a => { a.href = `mailto:${c.user}@${c.domain}?subject=${encodeURIComponent("System Design Kit - " + a.dataset.mail)}`; }); })();
</script>
