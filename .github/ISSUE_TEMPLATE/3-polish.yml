name: Something to polish
description: A block that doesn't import, a link that goes nowhere or anything on the site that could work better.
title: "[Polish] "
labels: ["polish"]
body:
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: A block name, a page or a link
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App and browser
      description: For example excalidraw.com in Chrome, Obsidian on Mac
